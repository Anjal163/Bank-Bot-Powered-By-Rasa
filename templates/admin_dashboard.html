<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard - SmartBank Bot</title>
    <style>
        body {
            font-family: Poppins, sans-serif;
            background: #0E4C68;
            color: white;
            padding: 40px;
        }
        h1 { margin-bottom: 20px; }
        .card {
            background: rgba(255,255,255,0.15);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            width: 350px;
        }
        a {
            text-decoration: none;
            color: #00E5FF;
            font-weight: bold;
        }
    </style>
</head>
<body>

<h1>Admin Dashboard</h1>

<div class="card">
    <h3>📊 View User Chat Logs</h3>
    <a href="/admin/chats">Open Logs</a>
</div>

<div class="card">
    <h3>🔑 Go to User Login Page</h3>
    <a href="/login" >User login</a>
</div> 
<div class="card">
    <h3>🚪 Logout</h3>
    <a href="/admin/logout">Logout</a>
</div>

</body>
</html>
