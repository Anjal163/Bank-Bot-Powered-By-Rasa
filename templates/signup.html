<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmartBank Signup</title>
<style>
    body {
        margin: 0;
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #0E4C68, #041C32);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
    }

    .signup-box {
        width: 380px;
        padding: 30px;
        background: rgba(255,255,255,0.15);
        border-radius: 20px;
        backdrop-filter: blur(15px);
        box-shadow: 0 0 20px rgba(0,0,0,0.4);
        text-align: center;
    }

    .signup-box h2 {
        margin-bottom: 20px;
        font-weight: 600;
    }

    input {
        width: 90%;
        padding: 12px;
        margin: 10px 0;
        border: none;
        border-radius: 10px;
        outline: none;
    }

    button {
        width: 95%;
        padding: 12px;
        margin-top: 15px;
        background: #1E3A8A;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
    }

    button:hover {
        background: #2563EB;
    }

    a {
        color: #FFD700;
        text-decoration: none;
        font-weight: 600;
    }
        .background-text {
    position: absolute;
    top: 12%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 45px;
    font-weight: 900;
    color: white;
    text-align: center;
    letter-spacing: 2px;
    z-index: 0;
    pointer-events: none;
    white-space: nowrap;
}

.login-box {
    position: relative;
    z-index: 1;
}
</style>
</head>
<body>
 <div class="background-text">
    Bank Bot – AI Chatbot for Banking FAQs
</div>
<div class="signup-box">
    <h2>Create SmartBank Account</h2>

    <form action="/signup" method="post">
        <input type="text" name="username" placeholder="Create Username" required><br>
        <!-- <input type="password" name="password" placeholder="Create Password" required><br> -->
        <input type="password" name="password" maxlength="50" placeholder="Create Password" required><br>


        <button type="submit">Sign Up</button>
    </form>

    <p style="margin-top:15px;">Already have an account?  
        <a href="/login">Login</a>
    </p>
</div>

</body>
</html>
