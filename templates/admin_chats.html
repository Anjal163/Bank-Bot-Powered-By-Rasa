<!DOCTYPE html>
<html>
<head>
    <title>Chat Logs - SmartBank Bot</title>
    <style>
        body {
            font-family: Poppins, sans-serif;
            background: #041C32;
            color: white;
            padding: 20px;
        }
        table {
            width: 100%;
            background: rgba(255,255,255,0.1);
            border-collapse: collapse;
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        th { background: rgba(0,0,0,0.3); }
        .back {
            margin-bottom: 15px;
            display: inline-block;
            color: #00E5FF;
            text-decoration: none;
        }
    </style>
</head>
<body>

<a href="/admin/dashboard" class="back">← Back to Dashboard</a>

<h2>User Chat Logs</h2>

<table>
    <tr>
        <th>User ID</th>
        <th>User Message</th>
        <th>Bot Reply</th>
        <th>Timestamp</th>
    </tr>

    {% for log in logs %}
    <tr>
        <td>{{ log.user_id }}</td>
        <td>{{ log.user_message }}</td>
        <td>
            {% for reply in log.bot_reply %}
                {{ reply }}<br>
            {% endfor %}
        </td>
        <td>{{ log.timestamp }}</td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
