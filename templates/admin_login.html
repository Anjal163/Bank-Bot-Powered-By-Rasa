<!DOCTYPE html>
<html>
<head>
    <title>Admin Login - SmartBank Bot</title>
    <style>
        body {
            font-family: Poppins, sans-serif;
            background: #041C32;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-box {
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 15px;
            width: 350px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border-radius: 8px;
            border: none;
        }
        button {
            margin-top: 15px;
            padding: 12px;
            width: 100%;
            background: #1E90FF;
            color: white;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #1C6ED5;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Admin Login</h2>

    <form action="/admin/login" method="POST">
        <input type="text" name="username" placeholder="Admin Username" required />
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit">Login</button>
    </form>
</div>

</body>
</html>
